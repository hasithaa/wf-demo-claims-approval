# Scrapes the workflow metrics every integration's Prometheus reporter serves on :9797.
# Target names are compose service names; the workflow module's own metrics (instances
# started/completed/failed, activity attempts, human task waits) appear per integration.
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: integrations
    metrics_path: /metrics
    static_configs:
      - targets: ["claims:9797", "bill-store:9797", "notifications:9797", "claims-agent:9797"]
        labels: {demo: claimflow}
