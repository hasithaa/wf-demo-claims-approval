# The edge in CLUSTER mode: two ICP nodes behind per-REQUEST round-robin.
#
# The single-node edge (nginx.conf) is a TCP passthrough. That is the wrong shape for a
# cluster: a TCP proxy balances per CONNECTION, and both the console in a browser and the
# bridge's HTTP client keep connections alive — every request on one connection would land
# on the same node, which is stickiness by connection reuse, not a cluster. So this config
# terminates TLS here (its own self-signed certificate, generated by build_cluster.sh) and
# re-originates HTTPS to the nodes, balancing every request independently.
#
# What that buys the demo: the node that accepts a console request is routinely NOT the node
# that answers the runtime's next heartbeat — the case the ICP's database-backed workflow
# tunnel exists for. A read is accepted by one node, claimed by whichever node hears the
# next heartbeat, and served from the shared cache to whichever node the poll lands on.
#
# Thunder stays a TCP passthrough below: it is a single node and the browser must see its
# own certificate.

user nginx;
# One worker, so the alternation is provable: each nginx worker keeps its OWN round-robin
# cursor, and with several workers a short sample splits 9/3 and looks like affinity that
# is not there.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format upstream_node '$remote_addr "$request" $status upstream=$upstream_addr '
                             'rt=$request_time';
    access_log /var/log/nginx/access.log upstream_node;

    # No keepalive to the upstreams on purpose: a pooled connection would balance once and
    # then stay put, which is the behaviour this config exists to avoid.
    upstream icp_runtime {
        server icp:9445;
        server icp-2:9445;
    }

    upstream icp_console {
        server icp:9446;
        server icp-2:9446;
    }

    # A command result carries whatever the operation answered — an instance history runs to
    # hundreds of kilobytes — so the body limit has to be generous.
    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_http_version 1.1;

    # The runtime port: heartbeats and command results from the integrations, balanced
    # per request.
    server {
        listen 9445 ssl;
        ssl_certificate /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        location / {
            proxy_pass https://icp_runtime;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
    }

    # The admin console.
    server {
        listen 9446 ssl;
        ssl_certificate /etc/nginx/certs/edge.crt;
        ssl_certificate_key /etc/nginx/certs/edge.key;

        location / {
            proxy_pass https://icp_console;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # The console's live updates ride a WebSocket, which pins that ONE connection to
            # whichever node accepted it. Note what that does not fix: the broadcaster is
            # per-process, so a client only receives events its own node published — a
            # pre-existing gap the cluster makes visible, not one it creates.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
}

stream {
    log_format basic '$remote_addr -> $upstream_addr [$protocol] $status $bytes_sent/$bytes_received $session_time';
    access_log /var/log/nginx/stream.log basic;

    # The identity provider, passed through untouched — the browser must see Thunder's own
    # certificate for the login redirect.
    upstream thunder {
        server thunder:8090;
    }

    server {
        listen 8090;
        proxy_pass thunder;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
