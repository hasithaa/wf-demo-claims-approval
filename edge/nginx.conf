# The single bridge between icp-net and integration-net — the demo's one gateway.
#
# Layer 4 on purpose: the ICP serves HTTPS with its own self-signed certificate, and a TCP
# proxy neither terminates nor re-signs it — what the integrations and the browser see is
# exactly what the ICP served. Thunder is likewise passed through untouched.
#
# The property under demo: integrations dial OUT to the ICP through this edge; the ICP has
# no route to any integration. Nothing listens on the integration side.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    log_format basic '$remote_addr -> $upstream_addr [$protocol] $status $bytes_sent/$bytes_received $session_time';
    access_log /var/log/nginx/stream.log basic;

    # Runtime listener: heartbeats in, command results back.
    upstream icp_runtime {
        server icp:9445;
    }

    # The admin console.
    upstream icp_console {
        server icp:9446;
    }

    # The identity provider, for browser logins and JWKS fetches.
    upstream thunder {
        server thunder:8090;
    }

    server {
        listen 9445;
        proxy_pass icp_runtime;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }

    server {
        listen 9446;
        proxy_pass icp_console;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }

    server {
        listen 8090;
        proxy_pass thunder;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
    }
}
