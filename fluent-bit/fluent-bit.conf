# Ships the integrations' logs into OpenSearch in the shape the ICP's observability tab
# reads: index ballerina-application-logs-YYYY.MM.DD, fields app_name/level/module/message.
# The integrations log through Docker's fluentd driver (tag claimflow.<service>), and dual
# logging keeps `docker compose logs` working beside this.
[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf
    # Chunks survive an OpenSearch outage on disk instead of only in memory.
    storage.path              /fluent-bit/buffer
    storage.sync              normal
    storage.checksum          off
    storage.backlog.mem_limit 5M
    storage.total_limit_size  100M

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224
    storage.type      filesystem

# The Ballerina log line inside Docker's `log` field becomes the document's fields.
[FILTER]
    Name         parser
    Match        claimflow.*
    Key_Name     log
    Parser       ballerina_json
    Parser       ballerina_logfmt
    Reserve_Data On

# app_name = the compose service (from the driver's tag). icp_runtimeId = the id the
# ICP console scopes log queries by: the bridge prints it on its own lines
# (icp.runtimeId="..."), so the last-seen value per service is stamped onto every record —
# the bridge heartbeats every few seconds, so the cache warms moments after startup.
[FILTER]
    Name    lua
    Match   claimflow.*
    script  enrich.lua
    call    enrich

# ballerinax/metrics.logs writes one line per metric sample through its own logger, tagged
# logger="metrics" with an empty message and the sample's fields as keys. Those go to the
# metrics index the console's metrics view reads; everything else is an application log. The
# record is re-emitted under a new tag after enrichment, so it already carries app_name and
# icp_runtimeId when it reaches the metrics output.
[FILTER]
    Name          rewrite_tag
    Match         claimflow.*
    Rule          $logger ^metrics$ metrics.$TAG false
    Emitter_Name  metrics_emitter

# The workflow module publishes one sample per run started/closed, activity attempt, data
# event and task decision, tagged logger="workflow-metrics" — the workflow-domain counterpart
# of the HTTP request samples above. They get their own index.
[FILTER]
    Name          rewrite_tag
    Match         claimflow.*
    Rule          $logger ^workflow-metrics$ wfmetrics.$TAG false
    Emitter_Name  workflow_metrics_emitter

# Metric samples get the console's derived fields after re-tagging; application logs need nothing more.
[FILTER]
    Name    lua
    Match   metrics.*
    Script  /fluent-bit/etc/enrich.lua
    Call    metrics

[OUTPUT]
    Name               es
    Match              claimflow.*
    Id_Key             doc_id
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    ballerina-application-logs
    Suppress_Type_Name On
    Replace_Dots       On
    Trace_Error        On

[OUTPUT]
    Name               es
    Match              metrics.*
    Id_Key             doc_id
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    ballerina-metrics-logs
    Suppress_Type_Name On
    Replace_Dots       On
    Trace_Error        On

[OUTPUT]
    Name               es
    Match              wfmetrics.*
    Id_Key             doc_id
    Host               opensearch
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    ballerina-workflow-metrics
    Suppress_Type_Name On
    Replace_Dots       On
    Trace_Error        On
