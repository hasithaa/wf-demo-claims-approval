# The Ballerina structured log line: time=... level=... module=... message="..." (+ extras).
[PARSER]
    Name        ballerina_log
    Format      regex
    Regex       ^time\s*=\s*(?<time>[^\s]+)\s+level\s*=\s*(?<level>[A-Z]+)\s+module\s*=\s*(?<module>[^\s]+)\s+message\s*=\s*"(?<message>.*?)"(?<extras>.*)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
