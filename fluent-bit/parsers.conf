# The integrations log JSON ([ballerina.log] format = "json"): every key-value the code attaches
# to a log call — taskId, userId, action, outcome on a workflow decision — arrives as its own field.
[PARSER]
    Name        ballerina_json
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On

# The workflow module's Java layer (worker, activity attempts) still prints Ballerina-style
# logfmt regardless of the log format setting; fluent-bit's native logfmt parser turns its
# key=value pairs into fields too. This used to be a regex that split the message at the first
# embedded quote and dumped the rest into `extras`.
[PARSER]
    Name        ballerina_logfmt
    Format      logfmt
    Types       response_time_seconds:float
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
