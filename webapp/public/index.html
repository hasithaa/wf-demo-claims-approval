<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claimflow</title>
<style>
  :root {
    --ground: #FBFAF7; --panel: #FFFFFF; --ink: #1C2B3A; --ink2: #5C6B7A;
    --line: #DDD8CC; --accent: #2E5E8C; --good: #3E7A4E; --warn: #B07A2A; --bad: #A34A3C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink);
         font: 16px/1.55 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 1rem; padding: .8rem 1.4rem;
           background: var(--panel); border-bottom: 2px solid var(--line); }
  header h1 { font-size: 1.15rem; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--accent); }
  .spacer { flex: 1; }
  .chip { font-size: .72rem; font-weight: 600; letter-spacing: .05em; padding: .12em .6em;
          border: 1px solid; border-radius: 3px; }
  .chip.role { color: var(--accent); border-color: var(--accent); }
  main { max-width: 60rem; margin: 1.5rem auto; padding: 0 1.2rem; }
  .tabs { display: flex; gap: .4rem; margin-bottom: 1rem; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); padding: .4rem 1rem;
                 border-radius: 5px; cursor: pointer; font: inherit; color: var(--ink2); }
  .tabs button.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 7px;
          padding: 1rem 1.2rem; margin-bottom: .9rem; }
  .card h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .muted { color: var(--ink2); font-size: .86rem; }
  .row { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; }
  .status { font-size: .72rem; font-weight: 700; letter-spacing: .05em; padding: .15em .6em;
            border-radius: 10px; border: 1px solid; }
  .status.PAID { color: var(--good); border-color: var(--good); }
  .status.REJECTED, .status.PAYMENT_REFUSED { color: var(--bad); border-color: var(--bad); }
  .status.BILL_REQUESTED { color: var(--warn); border-color: var(--warn); }
  .status.SUBMITTED, .status.BILL_ATTACHED { color: var(--accent); border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border: none; padding: .45rem 1rem;
                   border-radius: 5px; cursor: pointer; font: inherit; }
  button.quiet { background: none; border: 1px solid var(--line); padding: .4rem .9rem;
                 border-radius: 5px; cursor: pointer; font: inherit; color: var(--ink2); }
  button.good { background: var(--good); color: #fff; border: none; padding: .4rem .9rem; border-radius: 5px; cursor: pointer; font: inherit; }
  button.warn { background: var(--warn); color: #fff; border: none; padding: .4rem .9rem; border-radius: 5px; cursor: pointer; font: inherit; }
  button.bad  { background: var(--bad);  color: #fff; border: none; padding: .4rem .9rem; border-radius: 5px; cursor: pointer; font: inherit; }
  input, textarea { font: inherit; padding: .45rem .6rem; border: 1px solid var(--line);
                    border-radius: 5px; background: #fff; color: var(--ink); }
  .bell { position: relative; cursor: pointer; border: 1px solid var(--line); background: var(--panel);
          border-radius: 6px; padding: .35rem .6rem; font: inherit; }
  .bell .n { position: absolute; top: -7px; right: -7px; background: var(--bad); color: #fff;
             font-size: .68rem; border-radius: 9px; padding: 0 .35em; font-weight: 700; }
  #inboxPanel { position: absolute; right: 1.2rem; top: 3.4rem; width: 22rem; max-height: 24rem;
                overflow: auto; background: var(--panel); border: 1px solid var(--line);
                border-radius: 7px; box-shadow: 0 8px 28px rgba(28,43,58,.18); padding: .5rem; z-index: 5; }
  #inboxPanel .note { padding: .5rem .6rem; border-bottom: 1px solid var(--line); cursor: pointer; }
  #inboxPanel .note.unread { background: #F4F0E4; }
  #inboxPanel .note b { display: block; font-size: .9rem; }
  .login-hero { text-align: center; margin-top: 5rem; }
  .login-hero h2 { font-size: 1.6rem; }
  code { background: #EFECE3; border: 1px solid var(--line); border-radius: 4px;
         padding: .05em .3em; font-size: .85em; }
  .empty { color: var(--ink2); text-align: center; padding: 1.4rem 0; }
</style>
</head>
<body>
<header>
  <h1>Claim<span>flow</span></h1>
  <span class="muted">the classic portal</span>
  <div class="spacer"></div>
  <span id="who"></span>
  <button class="bell" id="bellBtn" hidden>🔔<span class="n" id="bellCount" hidden></span></button>
  <button class="quiet" id="authBtn">Sign in</button>
</header>
<div id="inboxPanel" hidden></div>
<main id="app"><div class="login-hero">
  <h2>Your claims, without the paperwork</h2>
  <p class="muted">Sign in to submit a claim, upload bills when asked, and watch it move.</p>
</div></main>
<script src="app.js"></script>
</body>
</html>
