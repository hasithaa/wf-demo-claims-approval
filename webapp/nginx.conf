# The Claimflow portal: static SPA plus a same-origin proxy.
#
# Everything the browser calls is on this one origin — /api/* proxies to the integration
# services inside the compose network, /oidc/* to Thunder's token endpoint — so there is
# no CORS story and no integration port has to be public for the portal to work. The one
# cross-origin hop left is the OIDC authorize redirect itself, which is how OIDC works.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 25m;

    server {
        listen 8080;

        # The SPA. Every route serves index.html; the app decides what to render.
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        location /api/claims/ {
            proxy_pass http://claims:8080/claims/;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/bills/ {
            proxy_pass http://bill-store:8080/bills/;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/agent/ {
            proxy_pass http://claims-agent:8080/agent/;
            proxy_set_header Authorization $http_authorization;
            # Reply reads are long polls; give them a real window before re-asking.
            proxy_read_timeout 75s;
        }
        location /api/notifications/ {
            proxy_pass http://notifications:8080/notifications/;
            proxy_set_header Authorization $http_authorization;
        }

        # Thunder's token endpoint, same-origin: the SPA exchanges its PKCE code here
        # instead of fighting the IdP's CORS policy. TLS toward Thunder is the demo's
        # self-signed pair.
        location /oidc/token {
            proxy_pass https://thunder:8090/oauth2/token;
            proxy_ssl_verify off;
        }
    }
}
