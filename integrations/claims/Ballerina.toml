[package]
org = "claimflow"
name = "claims"
version = "0.1.0"
distribution = "2201.13.4"

# Both resolve from the local repository. build.sh publishes them there (inside the
# builder container) from prebuilt/*.bala before building this package.
[[dependency]]
org = "ballerina"
name = "workflow"
version = "0.9.0"
repository = "local"

[[dependency]]
org = "wso2"
name = "icp.runtime.bridge"
version = "0.3.0-SNAPSHOT"
repository = "local"

[build-options]
observabilityIncluded = true
